name: Build HTML APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check HTML file
        shell: bash
        run: |
          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root."
            exit 1
          fi

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/example/htmlapk
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "HTMLAPK"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.htmlapk'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.htmlapk'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6385ff</item>
                  <item name="android:statusBarColor">#080d18</item>
                  <item name="android:navigationBarColor">#080d18</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="HTML APK Studio"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/htmlapk/MainActivity.java <<'EOF'
          package com.example.htmlapk;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.ValueCallback;
          import android.webkit.WebSettings;
          import android.webkit.PermissionRequest;
          import android.widget.Toast;

          public class MainActivity extends Activity {

              private WebView webView;
              private ValueCallback<Uri[]> fileCallback;
              private static final int FILE_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public boolean onShowFileChooser(
                              WebView view,
                              ValueCallback<Uri[]> callback,
                              FileChooserParams params) {

                          if (fileCallback != null) {
                              fileCallback.onReceiveValue(null);
                          }

                          fileCallback = callback;

                          Intent intent = params.createIntent();

                          try {
                              startActivityForResult(intent, FILE_REQUEST);
                          } catch (Exception e) {
                              fileCallback = null;
                              Toast.makeText(
                                  MainActivity.this,
                                  "باز کردن انتخاب‌گر فایل ممکن نیست",
                                  Toast.LENGTH_LONG
                              ).show();
                              return false;
                          }

                          return true;
                      }

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          request.deny();
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == FILE_REQUEST) {
                      if (fileCallback == null) return;

                      Uri[] results = null;

                      if (resultCode == Activity.RESULT_OK && data != null) {
                          Uri uri = data.getData();

                          if (uri != null) {
                              results = new Uri[] { uri };
                          } else {
                              results = WebChromeClient.FileChooserParams
                                  .parseResult(resultCode, data);
                          }
                      }

                      fileCallback.onReceiveValue(results);
                      fileCallback = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (fileCallback != null) {
                      fileCallback.onReceiveValue(null);
                      fileCallback = null;
                  }

                  if (webView != null) {
                      webView.destroy();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HTML-APK-Studio
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
